name: Prediction Game

on:
  schedule:
    - cron: '*/15 * * * *'   # ทุก 15 นาที
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python prediction_game.py
        env:
          DISCORD_BOT_TOKEN:        ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GAME_CHANNEL_ID:  ${{ secrets.DISCORD_GAME_CHANNEL_ID }}

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add prediction_state.json || true
          git diff --staged --quiet || git commit -m "chore: prediction state [skip ci]"
          git push
        continue-on-error: true
