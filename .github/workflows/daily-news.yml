name: Daily Discord Finance News

on:
  schedule:
    - cron: '0 1 * * *'    # 08:00 เช้า (สรุปข่าวเมื่อคืน + เอเชียเช้า)
    - cron: '0 8 * * *'    # 15:00 บ่าย (เอเชียปิด / ยุโรปเปิด)
    - cron: '0 13 * * *'   # 20:00 เย็น (US เปิดตลาด)
    - cron: '0 17 * * *'   # 00:00 กลางคืน (US ปิดตลาด)
  workflow_dispatch: {}   # กดรันเองได้จากหน้า Actions

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python daily_news.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
